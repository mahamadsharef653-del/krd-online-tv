name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout HTML
      uses: actions/checkout@v4
      with:
        path: html-src
    - name: Clone WebView Template
      run: |
        git clone --depth=1 https://github.com/vimalcvs/Android-WebView-App-Template.git template

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Inject HTML Files
      run: |
        rm -rf template/app/src/main/assets/*
        cp -r html-src/* template/app/src/main/assets/ || true
        rm -rf template/app/src/main/assets/template
        rm -rf template/app/src/main/assets/html-src

    - name: Build APK
      run: |
        cd template
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: KrdOnlineTV-APK
        path: template/app/build/outputs/apk/debug/app-debug.apk
